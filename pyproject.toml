[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usv"
version = "2026.1"
description = "Unladen Swallow Velocity - a GPU benchmarking tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name="Matthias Diener", email="matthias.diener@gmail.com" }]
keywords = ["benchmark", "gpu", "cuda", "rocm", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/matthiasdiener/usv/"
Issues = "https://github.com/matthiasdiener/usv/issues"

[project.entry-points.pytest11]
usv = "usv.pytest_plugin"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
jax = ["jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
