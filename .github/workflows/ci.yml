name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0  # no floating major tag exists

  pytest:
    # No GPU: tests that need one skip; the rest use the wall-clock timer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # No CPU pinning there either: checks usv keeps working off Linux.
          - os: macos-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first, so the install doesn't pull the multi-GB CUDA build.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Test
        run: python -m pytest -v -rs tests
